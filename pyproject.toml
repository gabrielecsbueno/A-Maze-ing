[project]
name = "mazegen"
version = "1.0"
description = "A Python maze generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Juan Carlos Santamaria Umanzor", email = "juasanta@student.42barcelona.com"},
	{name = "Gabriele Carolina De Souza Bueno", email = "gabde-so@student.42barcelona.com"},
]
dependencies=[
	"flake8>=7.3",
	"mypy>=2.0",
]
packages = [{include = "mazegen"}]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
